    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Azan Patel — translational neuroengineering. Closed-loop neuromodulatory techniques, computational modeling, and hardware engineering to better understand and treat stroke, Alzheimer's, and neuropsychiatric disorders.">
    <meta name="theme-color" content="#050505" />
    <script>
      // Runs before paint so a saved light theme never flashes dark.
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          if (light) document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  </body>
</html>
